services:
  maya:
    build:
      context: .
      dockerfile: Dockerfile
    image: maya-personal-agent:local
    container_name: maya-personal-agent
    restart: unless-stopped
    init: true
    ports:
      # Keep the app private; terminate TLS in a reverse proxy on the same host.
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      MAYA_DATA_DIR: /data
      MAYA_STORAGE_DRIVER: ${MAYA_STORAGE_DRIVER:-file}
      MAYA_FOUNDER_EMAIL: ${MAYA_FOUNDER_EMAIL:-}
      MAYA_FOUNDER_PASSWORD: ${MAYA_FOUNDER_PASSWORD:-}
      MAYA_REVIEWER_EMAIL: ${MAYA_REVIEWER_EMAIL:-}
      MAYA_REVIEWER_PASSWORD: ${MAYA_REVIEWER_PASSWORD:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      MAYA_TASK_WORKER_ENABLED: ${MAYA_TASK_WORKER_ENABLED:-false}
      MAYA_TASK_WORKER_POLL_MS: ${MAYA_TASK_WORKER_POLL_MS:-3000}
      MAYA_PLAN_WORKER_ENABLED: ${MAYA_PLAN_WORKER_ENABLED:-false}
      MAYA_PLAN_WORKER_POLL_MS: ${MAYA_PLAN_WORKER_POLL_MS:-3000}
      MAYA_SCHEDULE_WORKER_ENABLED: ${MAYA_SCHEDULE_WORKER_ENABLED:-false}
      MAYA_SCHEDULE_WORKER_POLL_MS: ${MAYA_SCHEDULE_WORKER_POLL_MS:-3000}
    volumes:
      - maya-data:/data
      - maya-developer-queue:/developer-queue
      - maya-developer-workspaces:/developer-workspaces
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 2.0
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Opt-in worker: no network, credentials, Docker socket or host mounts.
  developer-sandbox:
    image: maya-personal-agent:local
    profiles: ["developer-sandbox"]
    command: ["node", "--import", "tsx", "agent-core/developer-sandbox-worker.ts"]
    restart: unless-stopped
    init: true
    user: "node"
    network_mode: none
    environment:
      NODE_ENV: test
      MAYA_DEVELOPER_SANDBOX_QUEUE_DIR: /developer-queue
      MAYA_DEVELOPER_SANDBOX_WORKSPACE_DIR: /developer-workspaces
      MAYA_DEVELOPER_DEPENDENCY_SOURCE_DIR: /app/node_modules
      MAYA_DEVELOPER_DEPENDENCY_MANIFEST: /app/.maya-dependency-manifest.json
    volumes:
      - maya-developer-queue:/developer-queue
      - maya-developer-workspaces:/developer-workspaces
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 128
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('fs'); try { const s=JSON.parse(fs.readFileSync('/developer-queue/worker-status.json','utf8')); process.exit(s.status==='running' && Date.now()-Date.parse(s.heartbeatAt)<30000 ? 0 : 1); } catch { process.exit(1); }"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  maya-data:
  maya-developer-queue:
  maya-developer-workspaces:
