name: Maya CI

on:
  push:
    branches:
      - main
      - maya/foundation-architecture
      - maya/dashboard-foundation
      - maya/task-worker-foundation
      - maya/persistent-conversations
      - maya/goal-planner
      - maya/memory-retrieval
      - maya/specialist-runtime
      - maya/ceo-orchestrator
      - maya/supabase-persistence
      - maya/ceo-orchestrator
      - maya/supabase-persistence
      - maya/supabase-agent-state
      - maya/supabase-task-queue
      - maya/durable-audit-trail
  pull_request:
    branches:
      - main
      - maya/supabase-task-queue
      - maya/supabase-agent-state
      - maya/dashboard-foundation
      - maya/task-worker-foundation
      - maya/persistent-conversations
      - maya/goal-planner
      - maya/memory-retrieval
      - maya/specialist-runtime

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run lint
      - name: Unit tests
        run: bun run test
      - name: Production build
        run: bun run build
