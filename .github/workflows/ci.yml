name: Maya CI

on:
  push:
    branches:
      - main
      - "maya/**"
  pull_request:
    branches:
      - main
      - "maya/**"

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, tests, production build and container
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run lint
      - name: Unit and integration tests
        run: bun run test
      - name: Production build
        run: bun run build
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build production container image
        run: docker build --pull --tag maya-agent:ci .
