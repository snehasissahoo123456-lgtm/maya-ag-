name: Maya CI

on:
  push:
    branches:
      - main
      - "maya/**"
  pull_request:
    branches:
      - main
      - "maya/**"

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, tests, production build and container
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: maya_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: maya-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d maya_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run lint
      - name: Validate Windows bridge PowerShell scripts
        shell: pwsh
        run: |
          $files = @(
            "scripts/Start-Maya-Bridge.ps1",
            "scripts/Install-Maya-Bridge-Startup.ps1",
            "scripts/Uninstall-Maya-Bridge-Startup.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error ($file + ": " + $_.Message) }
              exit 1
            }
          }
          $installer = Get-Content -Raw "scripts/Install-Maya-Bridge-Startup.ps1"
          if ($installer -notmatch "-LogonType Interactive" -or $installer -notmatch "-RunLevel Limited") {
            throw "Bridge startup must use an interactive, limited-privilege current-user task."
          }
      - name: Apply Supabase migrations to disposable PostgreSQL
        env:
          PGPASSWORD: maya-ci-password
        run: |
          postgres_container_id="$(docker ps --filter 'ancestor=pgvector/pgvector:pg16' --format '{{.ID}}' | head -n 1)"
          if [ -z "$postgres_container_id" ]; then
            echo "Could not locate the PostgreSQL service container."
            docker ps --all
            exit 1
          fi
          export POSTGRES_CONTAINER_ID="$postgres_container_id"
          mkdir -p "$RUNNER_TEMP/pg-client-bin"
          cat > "$RUNNER_TEMP/pg-client-bin/psql" <<'PSQL'
          #!/usr/bin/env bash
          set -euo pipefail
          exec docker exec -i "$POSTGRES_CONTAINER_ID" psql "$@"
          PSQL
          chmod +x "$RUNNER_TEMP/pg-client-bin/psql"
          echo "$RUNNER_TEMP/pg-client-bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/pg-client-bin:$PATH"
          psql --host 127.0.0.1 --username postgres --dbname maya_ci --set ON_ERROR_STOP=1 <<'SQL'
          create schema if not exists extensions;
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin bypassrls;
          SQL
          for migration in supabase/migrations/*.sql; do
            echo "Applying $migration"
            docker exec -i "$POSTGRES_CONTAINER_ID" psql --username postgres --dbname maya_ci --set ON_ERROR_STOP=1 --file - < "$migration"
          done
          docker exec -i "$POSTGRES_CONTAINER_ID" psql --username postgres --dbname maya_ci --set ON_ERROR_STOP=1 --file - < supabase/tests/conversation_backfill.sql
          bash supabase/tests/goal_plan_lease_concurrency.sh
      - name: Unit and integration tests
        run: bun run test
      - name: Production build
        run: bun run build
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build production container image
        run: docker build --pull --tag maya-agent:ci .
